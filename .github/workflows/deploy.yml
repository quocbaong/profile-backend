name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-deploy:
    name: Test, Build Check & Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Dependencies
        run: go mod download

      - name: Run Go Vet (Static Analysis)
        run: go vet ./...

      - name: Compile & Build Check
        run: go build -v ./cmd/api

      - name: Trigger Render Deploy
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "All checks passed! Triggering Render deployment..."
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
